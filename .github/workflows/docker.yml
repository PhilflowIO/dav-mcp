name: Docker Image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'docker-compose.yml', 'src/**', 'package*.json', '.github/workflows/docker.yml', '.github/scripts/**']
  pull_request:
    branches: [main, develop]
    paths: ['Dockerfile', 'docker-compose.yml', 'src/**', 'package*.json', '.github/workflows/docker.yml', '.github/scripts/**']

jobs:
  # One leg per published architecture, each on a runner of that architecture.
  # The arm64 leg builds and boots the image without emulation, so a pull
  # request shows the image working on real arm64 hardware before a release.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Dockerfile's deps stage runs npm ci on the build host
      # ($BUILDPLATFORM) and copies node_modules into every target platform.
      # That is only correct while production dependencies are pure
      # JavaScript: an install script may build a native addon for the host,
      # and an os/cpu-pinned package is chosen for the host. Either would ship
      # an amd64 binary in the arm64 image, so fail here instead.
      - name: Production dependencies are platform-independent
        run: |
          node -e '
            const { packages } = require("./package-lock.json");
            const bad = Object.entries(packages)
              .filter(([path, meta]) => path && !meta.dev)
              .filter(([, meta]) => meta.hasInstallScript || meta.os || meta.cpu)
              .map(([path]) => path);
            if (bad.length) {
              console.log("::error::Production dependencies with install scripts or os/cpu pins: " + bad.join(", ") +
                ". The Dockerfile deps stage must then run on the target platform.");
              process.exit(1);
            }
          '

      - name: Runner is native ${{ matrix.arch }}
        run: |
          machine=$(uname -m)
          echo "runner machine: ${machine}"
          [ "$machine" = "${{ matrix.machine }}" ] || { echo "::error::expected ${{ matrix.machine }} runner, got '${machine}'"; exit 1; }

      # Only the cross-build below needs emulation; the arm64 leg has none.
      # QEMU and BuildKit come from ECR Public, not Docker Hub (#140), pinned to
      # the same multi-arch index digests Docker Hub serves.
      - name: Set up QEMU
        if: matrix.arch == 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          image: public.ecr.aws/vend/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Builds every platform the way the release does: cross-built from one
      # amd64 host, with the deps stage on $BUILDPLATFORM. The native arm64 leg
      # does not exercise that path, so this stays, on the amd64 leg only.
      # Nothing is loaded: --load holds a single platform; the native build
      # below is the one that gets booted.
      # This step exports the cache, not the amd64-only one: the GHA cache scope
      # is shared with publish-image.yml, and an amd64-only export from main
      # would replace the release's multi-arch cache and drop its arm64 layers.
      - name: Build all published platforms
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dav-mcp:ci
          cache-from: type=gha

      - name: Assert image architecture matches the runner
        run: |
          arch=$(docker image inspect dav-mcp:ci --format '{{.Architecture}}')
          echo "image architecture: ${arch}"
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "::error::expected ${{ matrix.arch }} image, got '${arch}'"; exit 1; }

      # The server exits 1 when CalDAV initialization fails (src/server-http.js:166),
      # so the smoke test needs a real backend to prove anything.
      - name: Start CalDAV backend
        run: .github/scripts/start-radicale.sh

      # PORT is overridden so the env-aware HEALTHCHECK stays covered: a probe
      # hardcoded to :3000 would report unhealthy against a healthy server.
      - name: Boot image and wait for healthy
        run: |
          docker run -d --name dav-mcp --network davci \
            -e CALDAV_SERVER_URL=http://radicale:5232 \
            -e CALDAV_USERNAME=ci \
            -e CALDAV_PASSWORD=ci \
            -e PORT=8080 \
            dav-mcp:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dav-mcp)
            case "$status" in
              healthy) echo "${{ matrix.arch }} container reported healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::Container never reported healthy (last status: ${status:-unknown})"
          docker inspect -f '{{json .State.Health}}' dav-mcp
          docker logs dav-mcp
          exit 1

      - name: Assert non-root runtime user
        run: |
          user=$(docker image inspect dav-mcp:ci --format '{{.Config.User}}')
          [ "$user" = "65532" ] || { echo "::error::expected uid 65532, got '${user}'"; exit 1; }

      - name: Assert no shell in image
        run: |
          for shell in /bin/sh /bin/bash /busybox/sh; do
            if docker run --rm --entrypoint "$shell" dav-mcp:ci -c 'exit 0' 2>/dev/null; then
              echo "::error::${shell} is present in the runtime image"
              exit 1
            fi
          done

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs dav-mcp 2>&1 || true
          docker logs radicale 2>&1 || true
