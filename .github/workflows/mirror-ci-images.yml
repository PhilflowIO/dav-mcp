name: Mirror CI images

# Copies every container image CI pulls (.github/ci-images.txt) to
# ghcr.io/philflowio/ci-mirror/<name>, all platforms, digest unchanged. The
# image jobs pull only from there, logged in with their GITHUB_TOKEN: GitHub
# runners share their IPs, and every public registry rate-limits anonymous
# pulls per IP (Docker Hub in #140, ECR Public in #142).
#
# The packages are private: they are CI tooling, not artifacts of this
# project. A package this workflow creates starts with the repository's
# visibility, public, and only its package settings can change that (there
# is no API), so a new image name is set to private there once
# (CONTRIBUTING.md, "CI image mirror"); the last step warns while one is
# public. The repository that published a package keeps access to it.
#
# Copying needs packages: write, so it never runs on a pull request, whose
# code is the pull request's own: docker.yml only verifies the mirror there
# (.github/scripts/mirror-ci-images.sh verify). A digest bumped in a pull
# request is copied by starting this workflow by hand on its branch. The
# release path (publish-image.yml) calls this before it builds, and the
# monthly run proves the mirror still serves every pinned digest.
on:
  workflow_call:
    inputs:
      extra-ref:
        description: 'Another ref whose .github/ci-images.txt is mirrored too, e.g. a tag being rebuilt'
        required: false
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '23 5 1 * *'

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror CI images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse pull request code
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        run: |
          echo "::error::Mirror CI images copies with packages: write and does not run for a pull request"
          exit 1

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A rebuilt tag builds from its own list (publish-image.yml), which may
      # name other digests than this commit's.
      - name: Checkout image list of ${{ inputs.extra-ref }}
        if: inputs.extra-ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.extra-ref }}
          path: .extra
          persist-credentials: false
          sparse-checkout: .github/ci-images.txt
          sparse-checkout-cone-mode: false

      # The Dockerfile and the CalDAV script fall back to public references
      # for builds outside CI; those must name the digests copied here.
      - name: Public defaults match the manifest
        run: .github/scripts/ci-images.sh check

      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo --version
          printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin

      - name: Copy missing images and verify digests
        id: copy
        run: |
          set -- .github/ci-images.txt
          [ -f .extra/.github/ci-images.txt ] && set -- "$@" .extra/.github/ci-images.txt
          echo "manifests=$*" >> "$GITHUB_OUTPUT"
          .github/scripts/mirror-ci-images.sh copy "$@"

      # A warning, not a failure: only a maintainer can change visibility.
      - name: Mirror packages are private
        env:
          MANIFESTS: ${{ steps.copy.outputs.manifests }}
        run: |
          # shellcheck disable=SC2086 # list of paths without spaces
          .github/scripts/mirror-ci-images.sh visibility $MANIFESTS
