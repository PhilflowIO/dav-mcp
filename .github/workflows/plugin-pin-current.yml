name: Plugin pin is current

# The Claude plugin moves to a new release in its own pull request after the
# release workflow has published it to npm (CONTRIBUTING.md, Releases). This
# fails, every day until it is done, when the release the plugin on main
# carries is older than what npm serves as latest, so the follow-up does not
# depend on someone remembering it.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-pin-current:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      # No install: the comparison is plain Node, from the same script that
      # writes the pin.
      - name: The pinned version is npm's latest
        run: |
          LATEST=$(npm view dav-mcp dist-tags.latest)
          export LATEST
          # The single quotes are on purpose: ${...} below is JavaScript.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { compareVersions } from "./scripts/sync-claude-plugin.js";
            const pinned = JSON.parse(readFileSync("claude-plugin/.claude-plugin/plugin.json", "utf8")).version;
            const latest = process.env.LATEST;
            console.log(`plugin carries dav-mcp@${pinned}, npm latest is ${latest}`);
            if (compareVersions(pinned, latest) < 0) {
              console.log(`::error::The Claude plugin still carries dav-mcp@${pinned}; npm latest is ${latest}. Run npm run plugin:sync on main and open a pull request.`);
              process.exit(1);
            }
          '
