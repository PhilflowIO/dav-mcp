name: Publish Container Image

# Called by release.yml once the GitHub release exists. It does not react to
# `release: published`; see publish-mcpb.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the image from, e.g. v4.3.1'
        required: true
        type: string
      latest:
        description: 'Move the latest tag to this image (false for a prerelease)'
        required: true
        type: boolean
  # Builds the dispatched ref, tag or branch, and pushes it as sha-<commit>
  # only. Version tags and latest move only when release.yml calls this
  # workflow (see "Derive tags").
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty on a manual dispatch: the dispatched ref
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # QEMU runs the arm64 variant for the boot smoke test below. The build
      # itself avoids emulation for npm ci (deps stage runs on BUILDPLATFORM).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Built and smoke-tested before anything is pushed, so a release can
      # never publish an image that was not observed booting.
      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: dav-mcp:verify
          cache-from: type=gha

      # The server exits 1 when CalDAV initialization fails
      # (src/server-http.js:166), so the smoke test needs a real backend.
      - name: Start CalDAV backend
        run: |
          docker network create davci
          docker run -d --name radicale --network davci tomsquest/docker-radicale:latest
          for _ in $(seq 1 30); do
            docker logs radicale 2>&1 | grep -q 'Radicale server ready' && exit 0
            sleep 2
          done
          echo "::error::Radicale did not become ready"
          docker logs radicale
          exit 1

      - name: Verify image boots and reports healthy
        run: |
          docker run -d --name dav-mcp --network davci \
            -e CALDAV_SERVER_URL=http://radicale:5232 \
            -e CALDAV_USERNAME=ci \
            -e CALDAV_PASSWORD=ci \
            -e PORT=8080 \
            dav-mcp:verify
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dav-mcp)
            case "$status" in
              healthy) echo "container reported healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::Container never reported healthy (last status: ${status:-unknown})"
          docker inspect -f '{{json .State.Health}}' dav-mcp
          docker logs dav-mcp
          exit 1

      # Every published platform is observed booting, not just the runner's
      # native one. --load holds a single platform, hence a separate build.
      - name: Build arm64 image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: dav-mcp:verify-arm64
          cache-from: type=gha

      # Same backend as the amd64 check; the arm64 container runs under QEMU,
      # so it gets a longer window to report healthy.
      - name: Verify arm64 image boots and reports healthy
        run: |
          docker run -d --name dav-mcp-arm64 --network davci \
            --platform linux/arm64 \
            -e CALDAV_SERVER_URL=http://radicale:5232 \
            -e CALDAV_USERNAME=ci \
            -e CALDAV_PASSWORD=ci \
            -e PORT=8080 \
            dav-mcp:verify-arm64
          arch=$(docker image inspect dav-mcp:verify-arm64 --format '{{.Architecture}}')
          [ "$arch" = "arm64" ] || { echo "::error::expected arm64 image, got '${arch}'"; exit 1; }
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dav-mcp-arm64)
            case "$status" in
              healthy) echo "arm64 container reported healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::arm64 container never reported healthy (last status: ${status:-unknown})"
          docker inspect -f '{{json .State.Health}}' dav-mcp-arm64
          docker logs dav-mcp-arm64
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # Version tags and latest only move when release.yml calls this
          # workflow, never on a manual dispatch, even of a tag: the semver
          # rules would otherwise fall back to the dispatched ref, and
          # metadata-action's latest=auto would add latest by itself.
          # latest comes only from the raw rule, which release.yml switches
          # off for a prerelease.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.latest == true }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      # docker format keeps HEALTHCHECK, which the OCI format drops.
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # The checks above run before the push, on locally built images, and the
  # arm64 one under QEMU: they prove the build. This job proves the published
  # artifact: each runner pulls what the registry actually serves and boots it
  # on real hardware of that architecture. No QEMU is set up here, so an arm64
  # image can only start on the arm64 runner.
  verify:
    needs: publish
    name: verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64

    # The package is public and pulled anonymously, the way a user pulls it.
    # If it ever turns private this job fails on the pull instead of passing
    # on credentials a user does not have.
    permissions: {}

    steps:
      - name: Runner is native ${{ matrix.arch }}
        run: |
          machine=$(uname -m)
          echo "runner machine: ${machine}"
          [ "$machine" = "${{ matrix.machine }}" ] || { echo "::error::expected ${{ matrix.machine }} runner, got '${machine}'"; exit 1; }

      # By digest, not by tag: the digest is the multi-arch index this run
      # pushed, so a tag moved by a later run cannot be verified by mistake.
      # Docker resolves the index to the manifest for the runner's platform.
      - name: Pull the published image by digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::publish job reported no digest"; exit 1; }
          ref="${IMAGE,,}@${DIGEST}"
          docker pull "$ref"
          docker tag "$ref" dav-mcp:published
          arch=$(docker image inspect dav-mcp:published --format '{{.Architecture}}')
          echo "pulled ${ref} (architecture: ${arch})"
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "::error::expected ${{ matrix.arch }} image, got '${arch}'"; exit 1; }

      - name: Start CalDAV backend
        run: |
          docker network create davci
          docker run -d --name radicale --network davci tomsquest/docker-radicale:latest
          for _ in $(seq 1 30); do
            docker logs radicale 2>&1 | grep -q 'Radicale server ready' && exit 0
            sleep 2
          done
          echo "::error::Radicale did not become ready"
          docker logs radicale
          exit 1

      - name: Verify published image boots and reports healthy
        run: |
          docker run -d --name dav-mcp --network davci \
            -e CALDAV_SERVER_URL=http://radicale:5232 \
            -e CALDAV_USERNAME=ci \
            -e CALDAV_PASSWORD=ci \
            -e PORT=8080 \
            dav-mcp:published
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dav-mcp)
            case "$status" in
              healthy) echo "published ${{ matrix.arch }} container reported healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::Published ${{ matrix.arch }} container never reported healthy (last status: ${status:-unknown})"
          docker inspect -f '{{json .State.Health}}' dav-mcp
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs dav-mcp 2>&1 || true
          docker logs radicale 2>&1 || true
