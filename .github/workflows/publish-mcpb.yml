name: Publish MCP Bundle

on:
  release:
    types: [published]
  # Rebuilds the bundle for an existing release, e.g. after this workflow
  # failed. The release must already exist; its asset is replaced.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the bundle to, e.g. v4.1.1'
        required: true

env:
  MCPB_VERSION: 2.1.2
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      # The asset name carries the manifest version. A tag that does not match
      # it would attach a bundle of another version to this release.
      - name: Tag matches manifest version
        id: version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          [ "$TAG" = "v${version}" ] || { echo "::error::tag ${TAG} does not match manifest.json version ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Production dependencies only: the bundle ships node_modules as is.
      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Pack the bundle
        run: npx --yes @anthropic-ai/mcpb@${MCPB_VERSION} pack . "dav-mcp-${{ steps.version.outputs.version }}.mcpb"

      # Checks the file that gets uploaded, not the working tree it came from.
      - name: Verify bundle contents and boot
        run: |
          npx --yes @anthropic-ai/mcpb@${MCPB_VERSION} unpack "dav-mcp-${{ steps.version.outputs.version }}.mcpb" "${RUNNER_TEMP}/bundle"
          node scripts/verify-mcpb.js "${RUNNER_TEMP}/bundle"

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dav-mcp-${{ steps.version.outputs.version }}.mcpb" --clobber
