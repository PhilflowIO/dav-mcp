name: Test Suite

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  # Advisories are published on their own schedule, not when someone opens a
  # pull request. The weekly run is for the audit job only.
  schedule:
    - cron: '23 5 * * 1'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage
        if: matrix.node-version == '20.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

  # Packs the MCP Bundle the way publish-mcpb.yml does on a release, then
  # boots the server from the unpacked bundle. A pull request that breaks the
  # bundle fails here, not after the release is out.
  bundle:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Claude Desktop runs the bundle on its own Node.js; 22 is the newest
      # line the test job covers.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      # Production dependencies only: the bundle ships node_modules as is.
      # No lifecycle scripts, as in publish-mcpb.yml.
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      # The mcpb CLI and its dependencies are pinned in .github/mcpb.
      - name: Install the mcpb CLI
        run: npm ci --prefix .github/mcpb --ignore-scripts

      - name: Pack and unpack the bundle
        run: |
          .github/mcpb/node_modules/.bin/mcpb pack . "${RUNNER_TEMP}/dav-mcp.mcpb"
          .github/mcpb/node_modules/.bin/mcpb unpack "${RUNNER_TEMP}/dav-mcp.mcpb" "${RUNNER_TEMP}/bundle"

      - name: Verify bundle contents and boot
        run: node scripts/verify-mcpb.js "${RUNNER_TEMP}/bundle"

  # The Claude plugin starts `npx -y dav-mcp@<version>` with the version in
  # package.json. Users of the plugin get whatever npm serves under it, so it
  # has to be published before the version reaches main (CONTRIBUTING.md,
  # Releases); a pull request that bumps it fails here until it is.
  plugin-pin:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The pinned version is on npm
        run: |
          pinned=$(node -p 'require("./claude-plugin/.mcp.json").mcpServers["dav-mcp"].args.at(-1)')
          npm view "$pinned" version >/dev/null || { echo "::error::$pinned is not on npm; publish it before this reaches main"; exit 1; }

  # npm 12 refuses git and remote-tarball dependencies by default
  # (allow-git=none, allow-remote=none). dav-mcp 4.1.2 depended on both and
  # `npx -y dav-mcp` failed before the server started (#100). This job runs
  # with those defaults: a git or tarball dependency in package-lock.json
  # fails `npm ci`, one in package.json fails the npx install below.
  npm-12:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'

      # Node 26 still bundles npm 11, which fetches git and tarball
      # dependencies; the npm this job is about is installed explicitly.
      - name: Use npm 12
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.0

      # The job only proves something while these are the defaults.
      - name: Check the npm 12 defaults are in effect
        run: |
          echo "node $(node --version), npm $(npm --version)"
          for key in allow-git allow-remote; do
            value=$(npm config get "$key")
            if [ "$value" != none ]; then
              echo "::error::npm config $key is '$value', expected 'none'"
              exit 1
            fi
          done

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # What a user runs: npx resolves dependencies from package.json, without
      # our lockfile, in a directory without our .npmrc. The server must
      # answer initialize and tools/list; the DAV server is unreachable on
      # purpose, the server connects on the first tool call.
      - name: Start the packed package through npx
        run: |
          TARBALL="$RUNNER_TEMP/$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          WORK=$(mktemp -d)
          cd "$WORK"
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"npm-12-check","version":"1"}}}'
          LIST='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          ( printf '%s\n' "$INIT"; sleep 3
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$LIST"; sleep 3 ) \
            | CALDAV_SERVER_URL=https://example.invalid/dav/ CALDAV_USERNAME=check CALDAV_PASSWORD=check \
              timeout 180 npx -y --package="$TARBALL" -- dav-mcp > out.jsonl 2> err.log \
            || { cat err.log; exit 1; }
          cat > check.cjs <<'JS'
          const lines = require('fs').readFileSync('out.jsonl', 'utf8').split('\n').filter(Boolean).map(JSON.parse);
          const info = lines.find(m => m.id === 1)?.result?.serverInfo;
          const tools = lines.find(m => m.id === 2)?.result?.tools ?? [];
          console.log(`initialize: ${info?.name} ${info?.version}, tools/list: ${tools.length} tools`);
          if (info?.name !== 'dav-mcp' || tools.length === 0) process.exit(1);
          JS
          node check.cjs || { cat err.log; exit 1; }

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Production tree only, read from package-lock.json: dev dependencies
      # never reach a user, and an advisory in jest should not block a fix.
      # Moderate and low findings are printed but do not fail the job.
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
